name: keepalive

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时一轮；私有仓库请改成 "17 */8 * * *" 并把 STAY_MIN 改 15
  workflow_dispatch:

permissions:
  contents: write            # 仅用于每月一次的 heartbeat 提交

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MC_HOST: server.hoster24.org
      MC_PORT: "24990"
      MC_USER: qx47_kp9z2
      MC_VERSION: "1.21.11"
      STAY_MIN: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: node src/keepalive.js --once

      # 防止仓库 60 天无活动导致定时任务被 GitHub 停用：每月提交一次
      - name: heartbeat
        if: always()
        run: |
          month="$(date -u +%Y-%m)"
          if [ "$(cat .keepalive 2>/dev/null)" != "$month" ]; then
            echo "$month" > .keepalive
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "heartbeat $month"
            git push
          fi
